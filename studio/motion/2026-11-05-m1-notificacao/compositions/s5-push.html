<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- Cena 5 (14,42–17,0s), tópico 3: "Notificações push ilimitadas." Pushes da loja chovem e empilham, acelerando; em
         "ilimitadas" viram um túnel infinito; no fim o push da frente voa na câmera e o branco dele abre o fechamento azul.
         Quadros 13–14. Claim: push-ilimitado. -->
  </head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #s5-bg { position: absolute; inset: 0; background: radial-gradient(1100px 900px at 70% 60%, #dbe7ff 0%, rgba(219,231,255,0) 70%), radial-gradient(900px 800px at 18% 28%, #e6eeff 0%, rgba(230,238,255,0) 70%), #f5f8fc; }
        #s5-all { position: absolute; inset: 0; }
        .s5-p { left: 160px; top: 640px; opacity: 0; }
        #s5-tun { perspective-origin: 540px 760px; }
        .s5-k { left: 160px; top: 960px; opacity: 0; }
        #s5-fly { left: 160px; top: 960px; opacity: 0; z-index: 30; }
        #s5-t2 { font-size: 120px; }
        .eb { opacity: 0; }
      </style>

      <div id="root" class="on-light" data-composition-id="s5-push" data-width="1080" data-height="1920">
        <div id="s5-bg"></div>
        <div id="s5-all">
          <div id="s5-stg" class="stg">
            <div class="st3" id="s5-st"><div class="cam3">
              <div class="ph3" id="s5-ph" data-layout-ignore>
                <div class="ph3-body"><div class="ph3-screen">
                  <div class="wp wp-loja"></div>
                  <div class="lk-time">21:49</div><div class="lk-date">quinta-feira, 5 de novembro</div>
                  <div class="ph3-cam"></div>
                  <div class="ph3-glare"></div>
                </div></div>
              </div>
            </div></div>
            <div id="s5-stack"></div>
            <div class="st3" id="s5-tun"></div>
            <div class="pz" id="s5-fly" data-layout-ignore><img src="assets/v2/icone-loja.svg" alt="" /><div><b>Sua Loja</b><span>Novidade pra você. Vem ver.</span></div><i>agora</i></div>
          </div>
          <div class="ttl" id="s5-t1"><div class="eb">Push<s><b class="on"></b><b class="on"></b><b class="on"></b></s></div><span class="mk"><span class="in">Notificações push</span></span></div>
          <div class="ttl" id="s5-t2"><span class="mk"><span class="in">Push</span></span><span class="mk"><span class="in"><em>ilimitado.</em></span></span></div>
        </div>
      </div>

      <script>
        (function () {
          const S = "[data-composition-id='s5-push']";
          const q = (s) => document.querySelector(S + " " + s);
          const qa = (s) => document.querySelectorAll(S + " " + s);
          const TXT = ["Novidade pra você. Vem ver.", "Seu cupom chegou.", "Chegou a coleção nova.", "Só no app, hoje.", "Novidade pra você. Vem ver.", "Volta pra ver o que chegou.", "Seu cupom chegou.", "Chegou a coleção nova."];
          const card = (cls, t) => '<div class="pz ' + cls + '" data-layout-ignore><img src="assets/v2/icone-loja.svg" alt="" /><div><b>Sua Loja</b><span>' + t + "</span></div><i>agora</i></div>";
          const stack = q("#s5-stack"), tun = q("#s5-tun");
          if (!stack.children.length) {
            stack.innerHTML = TXT.map((t) => card("s5-p", t)).join("");
            tun.innerHTML = Array.from({ length: 10 }, (_, i) => card("s5-k", TXT[i % TXT.length])).join("");
          }
          m1Edges(S);
          const tl = gsap.timeline({ paused: true });
          const ph = q("#s5-ph");
          gsap.set(ph, { x: 0, y: 1500, z: -700, rotationX: 18, scale: 0.8 });

          // Entra de baixo (continua o chicote para cima da cena 4)
          tl.fromTo("#s5-all", { y: 1300, filter: "blur(24px)" }, { y: 0, filter: "blur(0px)", duration: 0.28, ease: "power3.out" }, 0);
          tl.fromTo("#s5-t1 .eb", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out", immediateRender: false }, 0.04);
          m1In(tl, q("#s5-t1 .in"), 0.06);
          tl.to(ph, { y: 520, duration: 0.6, ease: "power3.out" }, 0.05);

          // Chuva de pushes, cada vez mais rápida; cada chegada empurra a pilha para baixo
          const A = [0.14, 0.5, 0.78, 0.98, 1.14, 1.26, 1.36, 1.44];
          const P = qa(".s5-p");
          const slot = (k) => ({ y: k * 210, scale: 0.92 - 0.04 * k, opacity: k >= 4 ? 0 : k === 3 ? 0.55 : 1, rotation: [-2, 1.5, -1, 2][k % 4] });
          P.forEach((el, i) => {
            tl.fromTo(el, { y: -520, scale: 0.92, opacity: 1, rotation: -6 }, { ...slot(0), duration: Math.min(0.26, (A[i + 1] || 1.6) - A[i]), ease: "power3.out", immediateRender: false }, A[i]);
            for (let j = i + 1; j < A.length; j++) {
              tl.to(el, { ...slot(j - i), duration: Math.min(0.2, (A[j + 1] || 1.6) - A[j]), ease: "power2.out" }, A[j]);
            }
          });

          // "ilimitadas" (1,58): a pilha vira túnel infinito
          m1Out(tl, q("#s5-t1 .in"), 1.48);
          tl.to("#s5-t1 .eb", { opacity: 0, duration: 0.2 }, 1.48);
          m1In(tl, qa("#s5-t2 .in")[0], 1.55);
          m1In(tl, qa("#s5-t2 .in")[1], 1.62);
          tl.to(P, { y: "+=260", scale: 0.6, opacity: 0, duration: 0.3, ease: "power2.in", stagger: 0.01 }, 1.52);
          tl.to(ph, { y: 2400, rotationX: 40, duration: 0.4, ease: "power2.in" }, 1.5);
          const K = qa(".s5-k");
          const N = K.length, GAP = 520, SPAN = N * GAP, SPEED = 1500;
          function place(t) {
            K.forEach((el, i) => {
              const d = ((i * GAP + SPEED * t) % SPAN) - (SPAN - 900); // -SPAN+900 .. 900
              const fadeIn = Math.min(1, Math.max(0, (d + SPAN - 900) / 1200));
              const fadeOut = d > 500 ? Math.max(0, 1 - (d - 500) / 400) : 1;
              gsap.set(el, { z: d, y: d * 0.12, rotationX: 8, opacity: t <= 0 ? 0 : fadeIn * fadeOut, zIndex: Math.round(d + 6000) });
            });
          }
          const drv = {}; let v = 0;
          Object.defineProperty(drv, "t", { get: () => v, set: (n) => { v = n; place(n); } });
          place(0);
          tl.fromTo(drv, { t: 0 }, { t: 1.05, duration: 1.05, ease: "none", immediateRender: false }, 1.53);

          // Saída (2,26–2,58): o push da frente voa na câmera; o branco toma o quadro
          tl.fromTo("#s5-fly", { opacity: 0, scale: 1, y: 0 }, { opacity: 1, duration: 0.06, immediateRender: false }, 2.24);
          tl.to("#s5-fly", { scale: 10, y: 120, duration: 0.32, ease: "power3.in" }, 2.26);
          tl.to(qa("#s5-t2 .in"), { opacity: 0, duration: 0.15 }, 2.36);

          window.__timelines["s5-push"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
