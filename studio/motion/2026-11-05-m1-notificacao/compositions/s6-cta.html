<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- Cena 6 (17,0–20,3s): fechamento no modo impacto. O branco do push que voou na câmera vira o azul (íris), sem wipe.
         "Sua loja na tela / do seu cliente." com o celular aceso em perspectiva e o botão na posição da vinheta. Quadro 15. -->
  </head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #s6-white { position: absolute; inset: 0; background: #fff; }
        #s6-iris { position: absolute; inset: 0; background: #155dfc; clip-path: circle(0px at 540px 1040px); }
        #s6-imp { opacity: 0; }
        #s6-glow { position: absolute; left: -60px; top: 380px; width: 1200px; height: 1200px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,255,255,.2), rgba(255,255,255,0)); opacity: 0; }
        #s6-btn { position: absolute; left: 50%; bottom: var(--safe-bottom); font-size: 36px; padding: 26px 38px; white-space: nowrap; opacity: 0; }
      </style>

      <div id="root" class="on-dark" data-composition-id="s6-cta" data-width="1080" data-height="1920">
        <div id="s6-white"></div>
        <div id="s6-iris"></div>
        <div class="bg-impact" id="s6-imp"></div>
        <div id="s6-stg" class="stg">
          <div id="s6-glow"></div>
          <div class="st3"><div class="cam3">
            <div class="ph3" id="s6-ph" data-layout-ignore>
              <div class="ph3-body"><div class="ph3-screen">
                <div class="wp wp-loja"></div>
                <div class="lk-time">21:49</div><div class="lk-date">quinta-feira, 5 de novembro</div>
                <div class="nt"><div class="nt-ic"><img src="assets/v2/icone-loja.svg" alt="" /></div><div class="nt-body"><div class="nt-head"><div class="nt-title">Sua Loja</div><span class="nt-when">agora</span></div><div class="nt-text">Novidade pra você. Vem ver.</div></div></div>
                <div class="ph3-cam"></div>
                <div class="ph3-glare" id="s6-glare"></div>
              </div></div>
            </div>
          </div></div>
        </div>
        <div class="ttl dk" id="s6-t"><span class="mk"><span class="in">Sua loja na tela</span></span><span class="mk"><span class="in"><em>do seu cliente.</em></span></span></div>
        <div class="cta" id="s6-btn">Crie sua conta e veja seu app grátis <span>→</span></div>
      </div>

      <script>
        (function () {
          const S = "[data-composition-id='s6-cta']";
          const q = (s) => document.querySelector(S + " " + s);
          const qa = (s) => document.querySelectorAll(S + " " + s);
          m1Edges(S);
          const tl = gsap.timeline({ paused: true });
          const ph = q("#s6-ph");
          const P15 = { x: 0, y: -110, z: -300, rotationX: 16, rotationY: -16, rotationZ: 6, scale: 0.44 };
          gsap.set(ph, { ...P15, y: 1900, rotationZ: 18, rotationY: -40 });

          // Branco → azul (íris), depois o gradiente de impacto (igual ao da vinheta)
          tl.fromTo("#s6-iris", { clipPath: "circle(0px at 540px 1040px)" }, { clipPath: "circle(1500px at 540px 1040px)", duration: 0.42, ease: "power3.in" }, 0.0);
          tl.to("#s6-imp", { opacity: 1, duration: 0.35, ease: "power1.inOut" }, 0.4);
          m1In(tl, qa("#s6-t .in")[0], 0.32);
          m1In(tl, qa("#s6-t .in")[1], 0.46);
          tl.to(ph, { ...P15, duration: 0.8, ease: "power3.out" }, 0.3);
          tl.to("#s6-glow", { opacity: 1, duration: 0.6 }, 0.5);
          tl.to(ph, { rotationY: -6, rotationZ: 3, y: -130, duration: 2.0, ease: "sine.inOut" }, 1.1);
          tl.fromTo("#s6-glare", { backgroundPosition: "100% 0" }, { backgroundPosition: "-60% 0", duration: 1.1, ease: "sine.inOut", immediateRender: false }, 1.3);

          // Botão (17,5s), já na posição da vinheta
          tl.set("#s6-btn", { xPercent: -50 }, 0);
          tl.fromTo("#s6-btn", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", immediateRender: false }, 0.5);

          // Passa para a vinheta: título e celular saem, o botão fica
          m1Out(tl, qa("#s6-t .in"), 3.0);
          tl.to(ph, { y: 300, opacity: 0, scale: 0.36, duration: 0.3, ease: "power2.in" }, 3.0);
          tl.to("#s6-glow", { opacity: 0, duration: 0.3 }, 3.0);

          window.__timelines["s6-cta"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
